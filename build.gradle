plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building an application
    id 'application'
}

// Set Java compatibility
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Define the main class for the application
application {
    mainClass = 'roo.display.imageimporter.ImageImporter'
}

dependencies {
    // This dependency is found on compile classpath of this component and consumers.
    //compile 'com.google.guava:guava:23.0'

    // Use JUnit test framework
    //testCompile 'junit:junit:4.12'

    // Note: lib JAR files are missing, commenting out for now
    // implementation files('lib/core.jar')
    // implementation files('lib/pde.jar')
    // implementation files('lib/commons-cli-1.4.jar')
    implementation 'info.picocli:picocli:3.8.2'

    // JUnit 5 (Jupiter) for tests
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // JUnit 4 vintage support if needed for legacy tests
    testImplementation 'org.junit.vintage:junit-vintage-engine'
}

test {
    useJUnitPlatform()
}

// In this section you declare where to find the dependencies of your project
repositories {
    // Use Maven Central for resolving dependencies
    mavenCentral()
}
